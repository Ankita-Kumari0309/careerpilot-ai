[build]
  base = "client"
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_apiKey,REACT_APP_authDomain,REACT_APP_projectId,REACT_APP_storageBucket,REACT_APP_messagingSenderId,REACT_APP_appId"

# SPA fallback — all routes serve index.html so React Router paths
# like /records, /my-jobs don't 404 on direct load or refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
